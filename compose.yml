name: image-api

services:
  image-api:
    image: image-api-gateway:local
    build:
      context: .
      dockerfile: Dockerfile.gateway
    user: "10001:10001"
    ports:
      - "${IMAGE_API_BIND_ADDRESS:-0.0.0.0}:${IMAGE_API_PORT:-8000}:8000"
    environment:
      IMAGE_API_UPSCALE_WORKER_URL: http://upscale-worker:9001
      IMAGE_API_BACKGROUND_WORKER_URL: http://background-worker:9002
      IMAGE_API_GENERATION_WORKER_URL: http://generation-worker:9003
      IMAGE_API_IDEOGRAM_WEIGHTS_PATH: /models/ideogram-4-nf4
      IMAGE_API_LONGCAT_EDIT_WEIGHTS_PATH: /models/longcat-image-edit
      IMAGE_API_LONGCAT_EDIT_TURBO_WEIGHTS_PATH: /models/longcat-image-edit-turbo
      IMAGE_API_WORKER_TIMEOUT_SECONDS: ${IMAGE_API_WORKER_TIMEOUT_SECONDS:-900}
      NO_PROXY: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
      no_proxy: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
    volumes:
      - ${IMAGE_API_IDEOGRAM_WEIGHTS_HOST_PATH:-./models/ideogram-4-nf4}:/models/ideogram-4-nf4:ro
      - ${IMAGE_API_LONGCAT_EDIT_WEIGHTS_HOST_PATH:-./models/longcat-image-edit}:/models/longcat-image-edit:ro
      - ${IMAGE_API_LONGCAT_EDIT_TURBO_WEIGHTS_HOST_PATH:-./models/longcat-image-edit-turbo}:/models/longcat-image-edit-turbo:ro
    depends_on:
      upscale-worker:
        condition: service_healthy
      background-worker:
        condition: service_healthy
      generation-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  upscale-worker:
    image: image-api-upscale-worker:local
    build: { context: ., dockerfile: Dockerfile.upscale }
    user: "10001:10001"
    expose: ["9001"]
    environment:
      IMAGE_API_UPSCALE_WEIGHTS_PATH: /models/upscale
      NO_PROXY: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
      no_proxy: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
    volumes:
      - ${IMAGE_API_UPSCALE_WEIGHTS_HOST_PATH:-./models/upscale}:/models/upscale:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  background-worker:
    image: image-api-background-worker:local
    build: { context: ., dockerfile: Dockerfile.background }
    user: "10001:10001"
    expose: ["9002"]
    environment:
      IMAGE_API_BRIA_WEIGHTS_PATH: /models/bria-rmbg-2.0
      IMAGE_API_BIREFNET_WEIGHTS_PATH: /models/birefnet-hr
      IMAGE_API_SAM2_CHECKPOINT_PATH: /models/sam2.1-hiera-large/sam2.1_hiera_large.pt
      NO_PROXY: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
      no_proxy: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
    volumes:
      - ${IMAGE_API_BRIA_WEIGHTS_HOST_PATH:-./models/bria-rmbg-2.0}:/models/bria-rmbg-2.0:ro
      - ${IMAGE_API_BIREFNET_WEIGHTS_HOST_PATH:-./models/birefnet-hr}:/models/birefnet-hr:ro
      - ${IMAGE_API_SAM2_WEIGHTS_HOST_PATH:-./models/sam2.1-hiera-large}:/models/sam2.1-hiera-large:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  generation-worker:
    image: image-api-generation-worker:local
    build: { context: ., dockerfile: Dockerfile.generation }
    user: "10001:10001"
    expose: ["9003"]
    environment:
      IMAGE_API_IDEOGRAM_WEIGHTS_PATH: /models/ideogram-4-nf4
      IMAGE_API_IDEOGRAM_REPOSITORY_ID: ideogram-ai/ideogram-4-nf4
      IMAGE_API_LONGCAT_EDIT_WEIGHTS_PATH: /models/longcat-image-edit
      IMAGE_API_LONGCAT_EDIT_TURBO_WEIGHTS_PATH: /models/longcat-image-edit-turbo
      NO_PROXY: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
      no_proxy: localhost,127.0.0.1,::1,upscale-worker,background-worker,generation-worker
    volumes:
      - ${IMAGE_API_IDEOGRAM_WEIGHTS_HOST_PATH:-./models/ideogram-4-nf4}:/models/ideogram-4-nf4:ro
      - ${IMAGE_API_LONGCAT_EDIT_WEIGHTS_HOST_PATH:-./models/longcat-image-edit}:/models/longcat-image-edit:ro
      - ${IMAGE_API_LONGCAT_EDIT_TURBO_WEIGHTS_HOST_PATH:-./models/longcat-image-edit-turbo}:/models/longcat-image-edit-turbo:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
